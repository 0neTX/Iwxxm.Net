<line x1="210.0" y1="148" x2="210.0" y2="182" stroke="#b5382c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<rect x="148.0" y="184" width="124" height="26" rx="6" fill="#f6e3e0" stroke="#b5382c" stroke-width="1"/>
