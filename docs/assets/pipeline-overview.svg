<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 250" width="956" height="250" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Iwxxm.Net processing pipeline</title>
<desc id="d">XML input flows through bounded read and safe parse, XSD validation, business rules and mapping into the domain model, which can be exported as GeoJSON. Each failing stage returns a categorized error.</desc>
