<text x="22" y="38" font-size="15" font-weight="700" fill="#1f2933">From XML to domain objects: every gate can say no, and says why</text>
<text x="22" y="236" font-size="11.5" fill="#52606d">Red: a failed Result with the shown ErrorCategory. The pipeline stops at the first failing gate; mapping of bulletins and SIGWX features is partial.</text>
