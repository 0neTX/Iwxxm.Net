<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Vertical profile of a cumulonimbus area</title>
<desc id="d">Vertical extents of the cloud, turbulence and icing features of the official WAFS example, drawn side by side against a flight-level and kilometre scale. The cumulonimbus has a reported top of 12496.8 metres and no reported base.</desc>
<rect x="0" y="0" width="860" height="520" rx="10" fill="#e9eef4" stroke="#7b8794" stroke-width="1"/>
<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa9c4"/><stop offset="0.75" stop-color="#8fa9c4" stop-opacity="0.55"/><stop offset="1" stop-color="#8fa9c4" stop-opacity="0.05"/></linearGradient></defs>
<text x="24" y="32" font-size="16" font-weight="700" fill="#1f2933">Reading a SIGWX cloud: top, base, distribution, type</text>
<text x="24" y="52" font-size="12" fill="#52606d">Same chart, three features, drawn by vertical extent only (they are at different places on the map).</text>
<rect x="100" y="70" width="700" height="370" fill="#f7f9fb" stroke="#7b8794"/>
<line x1="100" y1="440.0" x2="800" y2="440.0" stroke="#cbd5e0" stroke-width="1"/>
<text x="92" y="444.0" text-anchor="end" font-size="11" fill="#52606d">FL000</text>
<text x="808" y="444.0" font-size="11" fill="#52606d">0.0 km</text>
<line x1="100" y1="366.0" x2="800" y2="366.0" stroke="#cbd5e0" stroke-width="1"/>
<text x="92" y="370.0" text-anchor="end" font-size="11" fill="#52606d">FL100</text>
<text x="808" y="370.0" font-size="11" fill="#52606d">3.0 km</text>
<line x1="100" y1="292.0" x2="800" y2="292.0" stroke="#cbd5e0" stroke-width="1"/>
<text x="92" y="296.0" text-anchor="end" font-size="11" fill="#52606d">FL200</text>
<text x="808" y="296.0" font-size="11" fill="#52606d">6.1 km</text>
<line x1="100" y1="218.0" x2="800" y2="218.0" stroke="#cbd5e0" stroke-width="1"/>
<text x="92" y="222.0" text-anchor="end" font-size="11" fill="#52606d">FL300</text>
<text x="808" y="222.0" font-size="11" fill="#52606d">9.1 km</text>
<line x1="100" y1="144.0" x2="800" y2="144.0" stroke="#cbd5e0" stroke-width="1"/>
<text x="92" y="148.0" text-anchor="end" font-size="11" fill="#52606d">FL400</text>
<text x="808" y="148.0" font-size="11" fill="#52606d">12.2 km</text>
<line x1="100" y1="70.0" x2="800" y2="70.0" stroke="#cbd5e0" stroke-width="1"/>
<text x="92" y="74.0" text-anchor="end" font-size="11" fill="#52606d">FL500</text>
<text x="808" y="74.0" font-size="11" fill="#52606d">15.2 km</text>
<rect x="130" y="262.4" width="120" height="103.6" fill="#9ec5d9" stroke="#2c7a7b" stroke-width="1.5" rx="3"/>
<text x="190.0" y="254.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c7a7b">FL240</text>
<text x="190.0" y="382.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c7a7b">FL100</text>
<text x="190.0" y="314.2" text-anchor="middle" font-size="12" fill="#1f2933">icing</text>
<text x="190.0" y="329.2" text-anchor="middle" font-size="11" fill="#52606d">light, in precip.</text>
<rect x="300" y="144.0" width="110" height="44.4" fill="#f0c9a8" stroke="#c05621" stroke-width="1.5" rx="3"/>
<text x="355.0" y="136.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">12192 m</text>
<text x="355.0" y="204.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c05621">10363.2 m</text>
<text x="355.0" y="170.2" text-anchor="middle" font-size="12" fill="#1f2933">turbulence</text>
<text x="355.0" y="185.2" text-anchor="middle" font-size="11" fill="#52606d">moderate</text>
<path d="M526,440 L526,182.6 C526,166.6 490,170.6 476,158.6 C460,144.6 498,130.6 530,138.6 C544,124.6 576,124.6 590,138.6 C622,130.6 660,144.6 644,158.6 C630,170.6 594,166.6 594,182.6 L594,440 Z" fill="url(#fade)" stroke="#5b7a99" stroke-width="1.5"/>
<line x1="526" y1="438" x2="594" y2="438" stroke="#5b7a99" stroke-width="1" stroke-dasharray="3 4"/>
<text x="560" y="106.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b5382c">Top: 12496.8 M MSL</text>
<text x="560" y="120.6" text-anchor="middle" font-size="11" fill="#52606d">about FL410 (standard atmosphere)</text>
<text x="610" y="379.3" font-size="12" font-weight="700" fill="#1f2933">Base: nil (inapplicable)</text>
<text x="610" y="394.3" font-size="11" fill="#52606d">not reported: Base.IsNil is true,</text>
<text x="610" y="408.3" font-size="11" fill="#52606d">the library never invents 0</text>
<text x="560" y="215.5" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2933">CB</text>
<text x="560" y="235.5" text-anchor="middle" font-size="12" fill="#1f2933">Occasional (code 10)</text>
<text x="560" y="250.5" text-anchor="middle" font-size="12" fill="#1f2933">Cumulonimbus (code 9)</text>
<text x="24" y="498" font-size="11" fill="#52606d">Source: official WAFS example. Flight levels with ~ in the guide are derived from metres for display; the reported values stay in the model.</text>
</svg>
