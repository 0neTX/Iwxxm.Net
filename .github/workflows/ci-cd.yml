name: CI/CD — Build, Test & Publish to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege (AUD-M19): read-only by default; only the publish job may write packages.
permissions:
  contents: read

env:
  # Version of untagged builds (pull requests, main): prerelease artifacts that are never published.
  VERSION_PREFIX: '1.0.0'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # .NET 10 SDK: builds netstandard2.0/2.1 (Iwxxm.Net) and net10.0 (Iwxxm.Net.Validation.Saxon, tests)
      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Tag-based versioning without extra dependencies (AUD-M19): a tag vX.Y.Z[-suffix] is the package version;
      # any other build is the prerelease VERSION_PREFIX-ci.<run_number>.<attempt> (built and tested, never published).
      - name: Compute package version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '${GITHUB_REF#refs/tags/}' is not a semantic version (vMAJOR.MINOR.PATCH[-PRERELEASE])"
              exit 1
            fi
          else
            version="${VERSION_PREFIX}-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          core="${version%%-*}"
          echo "PACKAGE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "FILE_VERSION=${core}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Package version: ${version}"

      - name: Restore NuGet dependencies
        run: dotnet restore Iwxxm.Net.slnx

      - name: Build solution (Release)
        run: >
          dotnet build Iwxxm.Net.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ env.PACKAGE_VERSION }}
          -p:FileVersion=${{ env.FILE_VERSION }}
          -p:ContinuousIntegrationBuild=true

      - name: Run unit & integration tests with code coverage (Iwxxm.Net)
        run: >
          dotnet test tests/Iwxxm.Net.Tests/Iwxxm.Net.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"

      - name: Run official Schematron tests (Iwxxm.Net.Validation.Saxon)
        run: >
          dotnet test tests/Iwxxm.Net.Validation.Saxon.Tests/Iwxxm.Net.Validation.Saxon.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"

      # GeoPackage exporter (Iwxxm.Net.Export.GeoPackage): netstandard2.0, with the native SQLite bundled through
      # Microsoft.Data.Sqlite / SQLitePCLRaw. On Windows its test project also builds a net48 target, so a plain
      # `dotnet test` would run both; the runs are split instead (net10.0 here, on both runners; .NET Framework below, on
      # Windows only) so that each is reported, and fails, under its own name.
      - name: Run GeoPackage exporter tests, net10.0 (Iwxxm.Net.Export.GeoPackage)
        run: >
          dotnet test tests/Iwxxm.Net.Export.GeoPackage.Tests/Iwxxm.Net.Export.GeoPackage.Tests.csproj
          --configuration Release
          --no-build
          -f net10.0
          --verbosity normal
          --collect:"XPlat Code Coverage"

      # The native SQLite that net48 loads: SQLitePCLRaw copies it next to the test assembly, runtimes\win-x86\native and
      # runtimes\win-x64\native (the package's targets do this when the build runs on Windows with no RuntimeIdentifier;
      # win-arm64 is not copied). A missing file here is a build problem, not a loading problem, and is reported as such.
      - name: Check the native SQLite is copied for net48 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $out = 'tests/Iwxxm.Net.Export.GeoPackage.Tests/bin/Release/net48'
          foreach ($rid in 'win-x86', 'win-x64') {
            $dll = Join-Path $out "runtimes/$rid/native/e_sqlite3.dll"
            if (-not (Test-Path $dll)) { throw "Missing $dll" }
            Write-Host "Found $dll"
          }

      # net48 as a 64-bit process: loads runtimes\win-x64\native\e_sqlite3.dll. The hosted runner is x64, so this is the
      # one bitness that is certain to run here.
      - name: Run GeoPackage exporter tests on .NET Framework 4.8, x64 (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          dotnet test tests/Iwxxm.Net.Export.GeoPackage.Tests/Iwxxm.Net.Export.GeoPackage.Tests.csproj
          --configuration Release
          --no-build
          -f net48
          --verbosity normal

      # Prints what the NativeLoad test sees (the SQLite version, the bitness of the process, the runtime) and fails if
      # the process is not 64-bit.
      - name: Show the native load on .NET Framework 4.8, x64 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $log = dotnet test tests/Iwxxm.Net.Export.GeoPackage.Tests/Iwxxm.Net.Export.GeoPackage.Tests.csproj --configuration Release --no-build -f net48 --filter "FullyQualifiedName~NativeLoad" --logger "console;verbosity=detailed" | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) { throw "The NativeLoad test failed" }
          if ($log -notmatch '64-bit process') { throw "The NativeLoad test did not run as a 64-bit process" }

      # net48 as a 32-bit process: the test assembly is AnyCPU, so selecting the x86 test host makes it a 32-bit process
      # that must load runtimes\win-x86\native\e_sqlite3.dll (32-bit .NET Framework runs on the x64 runner through WoW64).
      # NOT RUN YET. If `dotnet test` does not honour the setting, the NativeLoad step below fails (it sees a 64-bit
      # process) and this step is not testing x86: then replace both steps by `vstest.console.exe <test dll> /Platform:x86` (it is
      # part of the Visual Studio installation of the runner) or verify x86 by hand. Windows ARM64 cannot be tested on a
      # hosted runner and is not covered.
      - name: Run GeoPackage exporter tests on .NET Framework 4.8, x86 (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          dotnet test tests/Iwxxm.Net.Export.GeoPackage.Tests/Iwxxm.Net.Export.GeoPackage.Tests.csproj
          --configuration Release
          --no-build
          -f net48
          --verbosity normal
          -- RunConfiguration.TargetPlatform=x86

      # Fails if the NativeLoad test does not report a 32-bit process, i.e. if the x86 selection above was ignored.
      - name: Show the native load on .NET Framework 4.8, x86 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $log = dotnet test tests/Iwxxm.Net.Export.GeoPackage.Tests/Iwxxm.Net.Export.GeoPackage.Tests.csproj --configuration Release --no-build -f net48 --filter "FullyQualifiedName~NativeLoad" --logger "console;verbosity=detailed" -- RunConfiguration.TargetPlatform=x86 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) { throw "The NativeLoad test failed" }
          if ($log -notmatch '32-bit process') { throw "The NativeLoad test did not run as a 32-bit process" }

      - name: Pack NuGet packages (.nupkg & .snupkg)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for project in src/Iwxxm.Net/Iwxxm.Net.csproj src/Iwxxm.Net.Validation.Saxon/Iwxxm.Net.Validation.Saxon.csproj; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --output ./artifacts \
              -p:Version=${{ env.PACKAGE_VERSION }} \
              -p:FileVersion=${{ env.FILE_VERSION }} \
              -p:ContinuousIntegrationBuild=true
          done

      - name: Verify the core package declares zero runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          nuspec=$(unzip -p "./artifacts/Iwxxm.Net.${{ env.PACKAGE_VERSION }}.nupkg" Iwxxm.Net.nuspec)
          if grep -q "<dependency " <<< "$nuspec"; then
            echo "::error::Iwxxm.Net must not declare runtime dependencies"
            exit 1
          fi

      - name: Upload NuGet package artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: github-nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: build-and-test
    # Publish only runs on a release tag ref (vX.Y.Z): a tag push, or a manual run selected on a tag. Pushes to main,
    # pull requests and manual runs on a branch only build and test.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Full history so the tagged commit can be checked against main.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only commits that are part of main may be released.
      - name: Require the tagged commit to be reachable from main
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit ${GITHUB_SHA} is not reachable from origin/main; refusing to publish"
            exit 1
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: github-nuget-packages
          path: ./artifacts

      - name: Publish package to GitHub Packages (https://github.com/0neTX/Iwxxm.Net/packages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "$GITHUB_TOKEN"
          --skip-duplicate

  publish-nuget:
    name: Publish to NuGet.org
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: nuget-release
      url: https://www.nuget.org/packages/Iwxxm.Net
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be reachable from main
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit ${GITHUB_SHA} is not reachable from origin/main; refusing to publish"
            exit 1
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: github-nuget-packages
          path: ./artifacts

      - name: NuGet Login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: 0neTX

      - name: Publish packages to NuGet.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
