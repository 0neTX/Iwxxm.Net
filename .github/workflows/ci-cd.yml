name: CI/CD — Build, Test & Publish to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege (AUD-M19): read-only by default; only the publish job may write packages.
permissions:
  contents: read

env:
  # Version of untagged builds (pull requests, main): prerelease artifacts that are never published.
  VERSION_PREFIX: '1.0.0'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # .NET 10 SDK: builds netstandard2.0/2.1 (Iwxxm.Net) and net10.0 (Iwxxm.Net.Validation.Saxon, tests)
      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Tag-based versioning without extra dependencies (AUD-M19): a tag vX.Y.Z[-suffix] is the package version;
      # any other build is the prerelease VERSION_PREFIX-ci.<run_number>.<attempt> (built and tested, never published).
      - name: Compute package version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '${GITHUB_REF#refs/tags/}' is not a semantic version (vMAJOR.MINOR.PATCH[-PRERELEASE])"
              exit 1
            fi
          else
            version="${VERSION_PREFIX}-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          core="${version%%-*}"
          echo "PACKAGE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "FILE_VERSION=${core}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Package version: ${version}"

      - name: Restore NuGet dependencies
        run: dotnet restore Iwxxm.Net.slnx

      - name: Build solution (Release)
        run: >
          dotnet build Iwxxm.Net.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ env.PACKAGE_VERSION }}
          -p:FileVersion=${{ env.FILE_VERSION }}
          -p:ContinuousIntegrationBuild=true

      - name: Run unit & integration tests with code coverage (Iwxxm.Net)
        run: >
          dotnet test tests/Iwxxm.Net.Tests/Iwxxm.Net.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"

      - name: Run official Schematron tests (Iwxxm.Net.Validation.Saxon)
        run: >
          dotnet test tests/Iwxxm.Net.Validation.Saxon.Tests/Iwxxm.Net.Validation.Saxon.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"

      - name: Pack NuGet packages (.nupkg & .snupkg)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for project in src/Iwxxm.Net/Iwxxm.Net.csproj src/Iwxxm.Net.Validation.Saxon/Iwxxm.Net.Validation.Saxon.csproj; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --output ./artifacts \
              -p:Version=${{ env.PACKAGE_VERSION }} \
              -p:FileVersion=${{ env.FILE_VERSION }} \
              -p:ContinuousIntegrationBuild=true
          done

      - name: Verify the core package declares zero runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          nuspec=$(unzip -p "./artifacts/Iwxxm.Net.${{ env.PACKAGE_VERSION }}.nupkg" Iwxxm.Net.nuspec)
          if grep -q "<dependency " <<< "$nuspec"; then
            echo "::error::Iwxxm.Net must not declare runtime dependencies"
            exit 1
          fi

      - name: Upload NuGet package artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: github-nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: build-and-test
    # Publish only runs on a release tag ref (vX.Y.Z): a tag push, or a manual run selected on a tag. Pushes to main,
    # pull requests and manual runs on a branch only build and test.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Full history so the tagged commit can be checked against main.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only commits that are part of main may be released.
      - name: Require the tagged commit to be reachable from main
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit ${GITHUB_SHA} is not reachable from origin/main; refusing to publish"
            exit 1
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: github-nuget-packages
          path: ./artifacts

      - name: Publish package to GitHub Packages (https://github.com/0neTX/Iwxxm.Net/packages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "$GITHUB_TOKEN"
          --skip-duplicate
